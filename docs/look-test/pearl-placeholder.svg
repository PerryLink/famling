<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" shape-rendering="crispEdges">
  <rect width="96" height="96" fill="none"/>
  <!-- tail -->
  <polygon points="60,68 84,64 84,78 62,80" fill="#1f6f8e" stroke="#0b1220" stroke-width="2"/>
  <!-- body -->
  <ellipse cx="48" cy="62" rx="15" ry="18" fill="#2f6bff" stroke="#0b1220" stroke-width="2"/>
  <!-- head -->
  <circle cx="48" cy="34" r="17" fill="#f6dfd2" stroke="#0b1220" stroke-width="2"/>
  <!-- hair -->
  <path d="M31 30 Q33 14 48 14 Q63 14 65 30 Q58 24 48 24 Q38 24 31 30Z" fill="#1b3b7a" stroke="#0b1220" stroke-width="2"/>
  <!-- fin ears -->
  <polygon points="31,28 20,18 24,36" fill="#2ec8dc" stroke="#0b1220" stroke-width="2"/>
  <polygon points="65,28 76,18 72,36" fill="#2ec8dc" stroke="#0b1220" stroke-width="2"/>
  <!-- eyes -->
  <rect x="41" y="33" width="3" height="5" fill="#101a30"/>
  <rect x="52" y="33" width="3" height="5" fill="#101a30"/>
  <!-- mouth -->
  <rect x="46" y="42" width="4" height="2" fill="#a06f66"/>
  <!-- pearl -->
  <circle cx="58" cy="62" r="4" fill="#f4d98e" stroke="#0b1220" stroke-width="1.5"/>
  <!-- legs -->
  <rect x="41" y="76" width="4" height="14" fill="#f6dfd2" stroke="#0b1220" stroke-width="2"/>
  <rect x="51" y="76" width="4" height="14" fill="#f6dfd2" stroke="#0b1220" stroke-width="2"/>
  <!-- foot shadow -->
  <ellipse cx="48" cy="92" rx="14" ry="3" fill="#0b1220" opacity="0.25"/>
  <!-- placeholder mark -->
  <rect x="0" y="0" width="96" height="2" fill="#e0b35a"/>
</svg>
